# fly.toml app configuration file for loona
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'loona'
primary_region = 'sin'

[build]

# Runs once per deploy, in its own machine, before any app machine starts.
# A failure here aborts the deploy and leaves the running version untouched.
[deploy]
  release_command = "node /app/docker-migrate.mjs"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
